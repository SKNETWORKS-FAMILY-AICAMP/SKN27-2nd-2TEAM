version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: netflix_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  backend:
    build: ./backend
    container_name: netflix_data_pipeline
    volumes:
      - ./backend:/app
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: netflix_db
      DB_USER: root
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
